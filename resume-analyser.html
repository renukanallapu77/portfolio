<!DOCTYPE html>
<html>
<head>
<title>AI Resume Analyzer - Renuka</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-5 md:p-10">
<div class="max-w-4xl mx-auto">
<h1 class="text-4xl font-bold mb-2">AI Resume Analyzer 🤖</h1>
<p class="text-gray-400 mb-8">Paste Job Description & Your Resume - Get Match Score!</p>

<div class="grid md:grid-cols-2 gap-5">
<textarea id="jd" class="bg-zinc-900 p-4 rounded-xl h-60 w-full" placeholder="Paste Job Description here... e.g., Looking for Python, JavaScript, React..."></textarea>
<textarea id="resume" class="bg-zinc-900 p-4 rounded-xl h-60 w-full" placeholder="Paste Your Resume text here..."></textarea>
</div>

<button onclick="analyze()" class="bg-white text-black font-bold px-8 py-3 rounded-full mt-6 hover:bg-orange-400">Analyze Now 🚀</button>

<div id="result" class="mt-8 bg-zinc-900 p-6 rounded-xl hidden">
<h2 class="text-2xl font-bold" id="score"></h2>
<p id="missing" class="mt-3 text-gray-300"></p>
<p id="tips" class="mt-3 text-green-400"></p>
</div>

<a href="index.html" class="inline-block mt-8 text-orange-400">← Back to Portfolio</a>
</div>

<script>
function analyze(){
 let jd = document.getElementById('jd').value.toLowerCase();
 let resume = document.getElementById('resume').value.toLowerCase();
 if(!jd || !resume){ alert('Please paste both!'); return; }
 let keywords = jd.match(/\b\w+\b/g);
 let uniqueKeywords = [...new Set(keywords)].filter(w=>w.length>3);
 let matched = uniqueKeywords.filter(w=>resume.includes(w));
 let score = Math.round((matched.length/uniqueKeywords.length)*100);
 let missing = uniqueKeywords.filter(w=>!resume.includes(w)).slice(0,10);
 
 document.getElementById('result').classList.remove('hidden');
 document.getElementById('score').innerText = `Match Score: ${score}% ${score>70?'🔥':'💪'}`;
 document.getElementById('missing').innerHTML = `<b>Missing Keywords:</b> ${missing.join(', ') || 'None! Great job!'}`;
 document.getElementById('tips').innerText = score>70 ? 'Your resume is strong for this job!' : 'Try adding missing keywords to your resume.';
}
</script>
</body>
</html>
