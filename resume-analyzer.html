<!DOCTYPE html>
<html>
<head>
<title>AI Resume Analyzer</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-5 md:p-10">
<div class="max-w-4xl mx-auto">
<h1 class="text-4xl font-bold mb-2">AI Resume Analyzer 🤖</h1>
<p class="text-gray-400 mb-8">Paste Job Description + Your Resume -> Get Match Score</p>

<div class="grid md:grid-cols-2 gap-5">
<textarea id="jd" class="bg-zinc-900 p-4 rounded-xl h-60" placeholder="Paste Job Description here... (Ex: Need Python, React, ML...)"></textarea>
<textarea id="resume" class="bg-zinc-900 p-4 rounded-xl h-60" placeholder="Paste Your Resume text here..."></textarea>
</div>

<button onclick="analyze()" class="bg-white text-black w-full mt-5 py-3 rounded-xl font-bold">Analyze Now</button>

<div id="result" class="mt-8 bg-zinc-900 p-6 rounded-xl hidden">
<h2 class="text-2xl font-bold" id="score"></h2>
<p id="missing" class="mt-3 text-gray-300"></p>
<p id="tips" class="mt-3 text-green-400"></p>
</div>
</div>

<script>
function analyze(){
let jd = document.getElementById('jd').value.toLowerCase();
let res = document.getElementById('resume').value.toLowerCase();
if(!jd || !res){ alert("Rendu paste chey bro!"); return; }

let jdWords = jd.split(/\W+/).filter(w=>w.length>3);
let matched = jdWords.filter(w=>res.includes(w));
let score = Math.round((matched.length / jdWords.length)*100);
if(score>100) score=92;

document.getElementById('result').classList.remove('hidden');
document.getElementById('score').innerText = `Match Score: ${score}% ${score>70?'🔥':'😐'}`;
document.getElementById('missing').innerText = "Matched Skills: " + [...new Set(matched)].slice(0,10).join(", ");
document.getElementById('tips').innerText = score<70 ? "Tip: JD lo unna keywords ni resume lo add chey!" : "Great! Almost ready to apply!";
}
</script>
</body>
</html>
